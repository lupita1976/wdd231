<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search results from the Pokedex application, final project for WDD 231 by Guadalupe Fernández León">
    <meta name="author" content="Guadalupe Fernández" />
    
    <meta property="og:title" content="Search Results - Pokedex">
    <meta property="og:image" content="https://lupita1976.github.io/wdd231/finalproject/images/pokedex-preview.png">
    <meta property="og:url" content="https://lupita1976.github.io/wdd231/finalproject/search-results.html">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles/poke.css">
    <link rel="stylesheet" href="styles/search.css">
    
    <title>Search Results - Pokedex</title>
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <svg class="pokeball-icon" viewBox="0 0 100 100" width="36" height="36">
                    <circle cx="50" cy="50" r="48" fill="none" stroke="#fff" stroke-width="4"/>
                    <line x1="2" y1="50" x2="98" y2="50" stroke="#fff" stroke-width="4"/>
                    <circle cx="50" cy="50" r="14" fill="#fff" stroke="#fff" stroke-width="4"/>
                    <circle cx="50" cy="50" r="6" fill="#1a237e"/>
                </svg>
                <span class="logo-text">Pokedex</span>
            </a>

            <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu" aria-expanded="false">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>

            <nav class="main-nav" id="mainNav">
                <a href="index.html" class="nav-link">Pokedex</a>
                <a href="search.html" class="nav-link active">Search</a>
                <a href="favorites.html" class="nav-link">
                    Favorites
                    <span class="fav-count" id="favCount">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="pokedex-main">
        <h1 class="page-title">Search Results</h1>

        <img src="images/pokedex-preview.png" 
             alt="Search results page"
             class="sr-only"
             width="1200" 
             height="400">

        <!-- Search criteria display -->
        <section class="search-criteria" id="searchCriteria">
            <!-- Injected by JS -->
        </section>

        <!-- Results grid -->
        <div class="pokemon-grid" id="resultsGrid" role="list">
            <!-- Results injected by JS -->
        </div>

        <div class="loading" id="loading">
            <div class="pokeball-spinner"></div>
            <p>Searching Pokémon...</p>
        </div>

        <div class="no-results" id="noResults" hidden>
            <p>No Pokémon found matching your criteria. Try adjusting your search.</p>
            <a href="search.html" class="cta-button">Back to Search</a>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-brand">
                <svg class="pokeball-icon" viewBox="0 0 100 100" width="28" height="28">
                    <circle cx="50" cy="50" r="48" fill="none" stroke="#fff" stroke-width="4"/>
                    <line x1="2" y1="50" x2="98" y2="50" stroke="#fff" stroke-width="4"/>
                    <circle cx="50" cy="50" r="14" fill="#fff" stroke="#fff" stroke-width="4"/>
                    <circle cx="50" cy="50" r="6" fill="#1a237e"/>
                </svg>
                <span>Pokedex</span>
            </div>
            <nav class="footer-nav">
                <a href="index.html">Pokedex</a>
                <a href="search.html">Search</a>
                <a href="favorites.html">Favorites</a>
                <a href="siteplan.html">Site Plan</a>
            </nav>
            <p class="footer-copy">
                &copy; 2026 Pokedex Project | WDD 231 | Data from
                <a href="https://pokeapi.co/" target="_blank" rel="noopener">PokéAPI</a>
            </p>
        </div>
    </footer>

    <script src="scripts/search-results.js"></script>
</body>
</html>
