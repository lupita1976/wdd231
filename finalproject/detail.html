<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pokémon details and stats">
    <meta name="author" content="Guadalupe Fernández" />
    <title>Pokémon Detail - Pokedex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/poke.css">
    <link rel="stylesheet" href="styles/detail.css">
    <link type="image/png" sizes="16x16" rel="icon" href="images/pokemon.png">
    <script src="scripts/detail.js" defer></script>
</head>
<body>

 
    <header class="detail-header" id="detailHeader">
        <div class="header-container">
            <a href="index.html" class="back-btn" aria-label="Back to Pokedex">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
            </a>
            <div class="pokemon-title">
                <h1 id="pokemonName">Loading...</h1>
                <span class="dex-number" id="pokemonNumber">#000</span>
            </div>
            <button class="fav-btn-large" id="favBtnLarge" aria-label="Add to favorites">
                <svg class="heart-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
            </button>
        </div>
    </header>

    
    <main class="detail-main">
        <div class="detail-container">

            <!-- Pokemon Image with Navigation -->
            <div class="pokemon-image-section">
                <button class="nav-arrow nav-prev" id="prevBtn" aria-label="Previous Pokémon">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </button>

                <div class="pokemon-image-wrapper">
                    <img id="pokemonImage" src="" alt="Pokémon sprite" class="pokemon-sprite">
                </div>

                <button class="nav-arrow nav-next" id="nextBtn" aria-label="Next Pokémon">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </button>
            </div>

           
            <div class="info-card">

                <!-- Type Badges -->
                <div class="type-badges" id="typeBadges">
                    <!-- Injected by JS -->
                </div>

             
                <section class="info-section">
                    <h2>About</h2>

                    <div class="about-grid">
                        <div class="about-item">
                            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                                <line x1="3" y1="6" x2="21" y2="6"/>
                                <path d="M16 10a4 4 0 0 1-8 0"/>
                            </svg>
                            <div>
                                <span class="about-value" id="pokemonWeight">0kg</span>
                                <span class="about-label">Weight</span>
                            </div>
                        </div>

                        <div class="about-item">
                            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <line x1="9" y1="3" x2="9" y2="21"/>
                                <line x1="15" y1="3" x2="15" y2="21"/>
                                <line x1="3" y1="9" x2="21" y2="9"/>
                                <line x1="3" y1="15" x2="21" y2="15"/>
                            </svg>
                            <div>
                                <span class="about-value" id="pokemonHeight">0m</span>
                                <span class="about-label">Height</span>
                            </div>
                        </div>

                        <div class="about-item abilities-item">
                            <div class="abilities-list" id="abilitiesList">
                                <!-- Injected by JS -->
                            </div>
                            <span class="about-label">Abilities</span>
                        </div>
                    </div>

                    <p class="flavor-text" id="flavorText">
                        Loading description...
                    </p>
                </section>

                <!-- Base Stats Section -->
                <section class="info-section">
                    <h2>Base Stats</h2>
                    <div class="stats-container" id="statsContainer">
                        <!-- Injected by JS -->
                    </div>
                </section>

            </div>
        </div>
    </main>

    
    <footer class="site-footer detail-footer" id="detailFooter">
        <div class="footer-container">
            <div class="footer-brand">
                <svg class="pokeball-icon" viewBox="0 0 100 100" width="28" height="28">
                    <circle cx="50" cy="50" r="48" fill="none" stroke="#fff" stroke-width="4"/>
                    <line x1="2" y1="50" x2="98" y2="50" stroke="#fff" stroke-width="4"/>
                    <circle cx="50" cy="50" r="14" fill="#fff" stroke="#fff" stroke-width="4"/>
                    <circle cx="50" cy="50" r="6" fill="#1a237e"/>
                </svg>
                <span>Pokedex</span>
            </div>
            <nav class="footer-nav">
                <a href="index.html">Pokedex</a>
                <a href="favorites.html">Favorites</a>
                <a href="siteplan.html">Site Plan</a>
            </nav>
            <p class="footer-copy">
                &copy; 2026 Pokedex Project | Guadalupe Fernández | WDD 231 | Data from
                <a href="https://pokeapi.co/" target="_blank" rel="noopener">PokéAPI</a>
            </p>
        </div>
    </footer>

    
</body>
</html>
